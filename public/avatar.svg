<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDDFD0"/>
      <stop offset="100%" stop-color="#F7C4B0"/>
    </linearGradient>
    <linearGradient id="hoodieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="120" cy="120" r="115" fill="url(#bgGrad)"/>
  <circle cx="120" cy="120" r="105" fill="#ffffff" opacity="0.1"/>

  <!-- Hoodie / Clothes Body -->
  <path d="M40 240 C45 190 70 165 100 162 L140 162 C170 165 195 190 200 240 Z" fill="url(#hoodieGrad)" filter="url(#softShadow)"/>
  
  <!-- Hoodie Strings & Collar Details -->
  <path d="M100 162 C108 180 115 192 120 192 C125 192 132 180 140 162" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  <path d="M112 185 L112 215" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="112" cy="216" r="2.5" fill="#CBD5E1"/>
  <path d="M128 185 L128 215" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="128" cy="216" r="2.5" fill="#CBD5E1"/>

  <!-- Neck -->
  <rect x="105" y="140" width="30" height="28" rx="8" fill="url(#skinGrad)"/>
  <path d="M105 145 C113 152 127 152 135 145 L135 155 C125 160 115 160 105 155 Z" fill="#E8A995" opacity="0.4"/>

  <!-- Ears -->
  <ellipse cx="68" cy="122" rx="9" ry="13" fill="url(#skinGrad)"/>
  <ellipse cx="68" cy="122" rx="5" ry="7" fill="#E8A995" opacity="0.5"/>
  <ellipse cx="172" cy="122" rx="9" ry="13" fill="url(#skinGrad)"/>
  <ellipse cx="172" cy="122" rx="5" ry="7" fill="#E8A995" opacity="0.5"/>

  <!-- Face -->
  <path d="M72 108 C72 70 93 68 120 68 C147 68 168 70 168 108 C168 144 148 162 120 162 C92 162 72 144 72 108 Z" fill="url(#skinGrad)" filter="url(#softShadow)"/>

  <!-- Cheeks Blush -->
  <circle cx="86" cy="126" r="8" fill="#F472B6" opacity="0.25"/>
  <circle cx="154" cy="126" r="8" fill="#F472B6" opacity="0.25"/>

  <!-- Hair Base & Bangs -->
  <path d="M66 100 C66 60 90 40 120 40 C150 40 174 60 174 100 C174 104 169 104 167 98 C163 76 148 64 120 64 C92 64 77 76 73 98 C71 104 66 104 66 100 Z" fill="url(#hairGrad)"/>
  <path d="M72 82 C82 72 95 72 106 80 C116 70 134 70 144 82 C154 75 163 78 168 86 C165 92 158 92 154 86 C144 78 132 80 126 88 C120 82 108 80 98 88 C88 80 78 84 72 88 Z" fill="url(#hairGrad)"/>

  <!-- Glasses -->
  <rect x="80" y="104" width="32" height="24" rx="8" fill="none" stroke="#1E293B" stroke-width="3.5"/>
  <rect x="128" y="104" width="32" height="24" rx="8" fill="none" stroke="#1E293B" stroke-width="3.5"/>
  <path d="M112 114 C116 111 124 111 128 114" fill="none" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M80 114 L68 110" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  <path d="M160 114 L172 110" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  <path d="M85 110 L95 110" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M133 110 L143 110" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Eyes behind glasses -->
  <ellipse cx="96" cy="116" rx="4" ry="4.5" fill="#1E293B"/>
  <circle cx="97.5" cy="114.5" r="1.5" fill="#ffffff"/>
  <ellipse cx="144" cy="116" rx="4" ry="4.5" fill="#1E293B"/>
  <circle cx="145.5" cy="114.5" r="1.5" fill="#ffffff"/>

  <!-- Eyebrows -->
  <path d="M84 98 C90 95 98 95 104 98" fill="none" stroke="#262626" stroke-width="3" stroke-linecap="round"/>
  <path d="M136 98 C142 95 150 95 156 98" fill="none" stroke="#262626" stroke-width="3" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M118 124 C119 127 121 127 122 124" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Friendly Smile -->
  <path d="M110 137 C115 144 125 144 130 137" fill="none" stroke="#9A3412" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Subtle code badge floating icon -->
  <g transform="translate(164, 154)">
    <circle cx="16" cy="16" r="16" fill="#3B82F6" filter="url(#softShadow)"/>
    <path d="M11 13 L8 16 L11 19 M21 13 L24 16 L21 19 M17 11 L15 21" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
