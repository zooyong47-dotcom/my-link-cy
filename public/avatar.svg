<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <pattern id="avatarDots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#000000" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Hard Black Shadow for Avatar Base -->
  <circle cx="124" cy="124" r="110" fill="#000000"/>
  <!-- Neobrutalism Base: Vibrant Cyan with thick black border -->
  <circle cx="120" cy="120" r="110" fill="#67E8F9" stroke="#000000" stroke-width="6"/>
  <!-- Subtle dot pattern texture -->
  <circle cx="120" cy="120" r="107" fill="url(#avatarDots)"/>

  <!-- Character Clothes (Vibrant Purple Hoodie with thick black stroke) -->
  <path d="M38 236 C45 185 70 160 100 156 L140 156 C170 160 195 185 202 236 Z" fill="#C084FC" stroke="#000000" stroke-width="5" stroke-linejoin="round"/>
  
  <!-- Hoodie Collar & Strings -->
  <path d="M98 156 C106 178 114 190 120 190 C126 190 134 178 142 156" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M112 186 L112 216" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="112" cy="218" r="4" fill="#FFE169" stroke="#000000" stroke-width="2"/>
  <path d="M128 186 L128 216" stroke="#000000" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="128" cy="218" r="4" fill="#FFE169" stroke="#000000" stroke-width="2"/>

  <!-- Neck -->
  <rect x="106" y="136" width="28" height="26" rx="6" fill="#FDE047" stroke="#000000" stroke-width="4"/>

  <!-- Ears -->
  <ellipse cx="66" cy="118" rx="10" ry="14" fill="#FDE047" stroke="#000000" stroke-width="4"/>
  <ellipse cx="174" cy="118" rx="10" ry="14" fill="#FDE047" stroke="#000000" stroke-width="4"/>

  <!-- Face: Bold Pastel Warm Yellow / Peach with thick border -->
  <path d="M72 104 C72 66 93 64 120 64 C147 64 168 66 168 104 C168 142 148 160 120 160 C92 160 72 142 72 104 Z" fill="#FDE047" stroke="#000000" stroke-width="5"/>

  <!-- Cheeks: Bold Pink Neo-Circles -->
  <circle cx="86" cy="126" r="10" fill="#F472B6" stroke="#000000" stroke-width="3"/>
  <circle cx="154" cy="126" r="10" fill="#F472B6" stroke="#000000" stroke-width="3"/>

  <!-- Hair: Jet Black Chunky Bangs -->
  <path d="M64 96 C64 54 88 34 120 34 C152 34 176 54 176 96 C176 102 170 102 167 94 C162 70 148 58 120 58 C92 58 78 70 73 94 C70 102 64 102 64 96 Z" fill="#000000" stroke="#000000" stroke-width="4"/>
  <path d="M70 78 C82 66 96 68 108 76 C118 66 136 66 146 78 C156 70 164 74 168 84 C164 90 156 90 152 82 C142 74 130 76 124 84 C118 78 106 76 96 84 C86 76 76 80 70 84 Z" fill="#000000" stroke="#000000" stroke-width="3"/>

  <!-- Glasses: Thick Rectangular Black Frames with Highlights -->
  <!-- Left frame -->
  <rect x="78" y="100" width="34" height="26" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="4.5"/>
  <!-- Right frame -->
  <rect x="128" y="100" width="34" height="26" rx="6" fill="#FFFFFF" stroke="#000000" stroke-width="4.5"/>
  <!-- Bridge -->
  <rect x="112" y="110" width="16" height="5" fill="#000000"/>
  
  <!-- Eyes inside glasses (retro cute pupils) -->
  <circle cx="95" cy="113" r="5" fill="#000000"/>
  <circle cx="97" cy="111" r="2" fill="#FFFFFF"/>
  <circle cx="145" cy="113" r="5" fill="#000000"/>
  <circle cx="147" cy="111" r="2" fill="#FFFFFF"/>

  <!-- Eyebrows -->
  <path d="M82 92 L106 94" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M134 94 L158 92" stroke="#000000" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Smile -->
  <path d="M110 136 Q120 146 130 136" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round"/>

  <!-- Neobrutalism Floating Sticker: "DEV" Badge -->
  <g transform="translate(160, 160) rotate(-10)">
    <rect x="4" y="4" width="56" height="26" fill="#000000" rx="4"/>
    <rect x="0" y="0" width="56" height="26" fill="#4ADE80" stroke="#000000" stroke-width="3" rx="4"/>
    <text x="10" y="18" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#000000">DEV ✦</text>
  </g>
</svg>
