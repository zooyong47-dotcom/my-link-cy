<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Dot pattern for neobrutalism texture -->
    <pattern id="dotPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.5" fill="#000000" opacity="0.18"/>
    </pattern>
    <pattern id="checker" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="15" height="15" fill="#000000"/>
      <rect x="15" y="15" width="15" height="15" fill="#000000"/>
    </pattern>
  </defs>

  <!-- Background: Bold Vibrant Yellow -->
  <rect width="1200" height="400" fill="#FFE169"/>
  <!-- Dot Grid Texture -->
  <rect width="1200" height="400" fill="url(#dotPattern)"/>

  <!-- Checkerboard stripe on top right -->
  <g transform="translate(920, -20) rotate(12)">
    <rect width="320" height="180" fill="url(#checker)" opacity="0.12"/>
    <rect width="320" height="180" fill="none" stroke="#000000" stroke-width="4"/>
  </g>

  <!-- Giant Retro Geometric Shapes with thick black borders & hard shadows -->
  <!-- Shape 1: Cyan polygon block -->
  <g transform="translate(80, 40) rotate(-6)">
    <!-- Hard shadow -->
    <rect x="8" y="8" width="220" height="140" fill="#000000" rx="16"/>
    <!-- Main block -->
    <rect x="0" y="0" width="220" height="140" fill="#67E8F9" stroke="#000000" stroke-width="4" rx="16"/>
    <text x="30" y="80" font-family="system-ui, sans-serif" font-weight="900" font-size="34" fill="#000000">&lt;CODING /&gt;</text>
  </g>

  <!-- Shape 2: Hot Pink Circle with Star -->
  <g transform="translate(480, 70)">
    <circle cx="86" cy="86" r="75" fill="#000000"/>
    <circle cx="80" cy="80" r="75" fill="#F472B6" stroke="#000000" stroke-width="4"/>
    <!-- Big star inside -->
    <polygon points="80,25 96,65 140,65 104,92 118,135 80,108 42,135 56,92 20,65 64,65" fill="#FFE169" stroke="#000000" stroke-width="3"/>
  </g>

  <!-- Shape 3: Bright Purple Card with terminal vibe -->
  <g transform="translate(780, 60) rotate(5)">
    <rect x="10" y="10" width="280" height="150" fill="#000000" rx="14"/>
    <rect x="0" y="0" width="280" height="150" fill="#C084FC" stroke="#000000" stroke-width="4" rx="14"/>
    <!-- Terminal header buttons -->
    <circle cx="30" cy="30" r="7" fill="#EF4444" stroke="#000000" stroke-width="2"/>
    <circle cx="50" cy="30" r="7" fill="#FBBF24" stroke="#000000" stroke-width="2"/>
    <circle cx="70" cy="30" r="7" fill="#10B981" stroke="#000000" stroke-width="2"/>
    <line x1="0" y1="50" x2="280" y2="50" stroke="#000000" stroke-width="3"/>
    <text x="25" y="95" font-family="monospace" font-weight="900" font-size="20" fill="#000000">$ git commit -m</text>
    <text x="25" y="125" font-family="monospace" font-weight="900" font-size="20" fill="#000000">"hello world!" ⚡</text>
  </g>

  <!-- Sparkles & Crosses (Neobrutalism accents) -->
  <g fill="#000000">
    <path d="M 370 60 L 378 80 L 398 88 L 378 96 L 370 116 L 362 96 L 342 88 L 362 80 Z"/>
    <path d="M 1120 180 L 1125 195 L 1140 200 L 1125 205 L 1120 220 L 1115 205 L 1100 200 L 1115 195 Z"/>
    <path d="M 700 280 L 705 292 L 717 297 L 705 302 L 700 314 L 695 302 L 683 297 L 695 292 Z"/>
    <!-- Plus signs -->
    <rect x="260" y="240" width="30" height="8" rx="2"/>
    <rect x="271" y="229" width="8" height="30" rx="2"/>
    <rect x="1060" y="80" width="24" height="6" rx="2"/>
    <rect x="1069" y="71" width="6" height="24" rx="2"/>
  </g>
</svg>
